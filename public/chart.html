<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tianji 天機 - 專業排盤室 (宮位本位模式)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/dashboard.css">
    <script src="/app.js"></script>
    <script src="/star_investment_guide.js"></script>
    <script src="/glossary.js"></script>
</head>
<body>
    <script src="/nav.js"></script>

    <div class="dash-content" id="main-content">
        <!-- Error State -->
        <div id="auth-error" class="hidden dash-hero">
            <h2 class="text-2xl font-bold mb-4" style="color:#f87171">存取被拒絕</h2>
            <p class="dash-hero-desc">請先登入會員以存取專業排盤室。</p>
            <a href="/login.html" class="dash-btn dash-btn-primary">前往登入</a>
        </div>

        <div id="chart-view" class="hidden dash-layout dash-layout-1-3">
            <div class="dash-stack-sm">
                <div class="dash-card">
                    <div class="dash-card-header">
                        <div class="dash-card-title">測算設定</div>
                    </div>
                    <div class="text-sm mb-4" style="color:var(--text-muted)">
                        命主：<span id="p-name" class="font-bold" style="color:var(--text-primary)"></span><br>
                        生辰：<span id="p-birth" style="color:#c4b5fd"></span>
                    </div>

                    <div class="mb-4">
                        <label class="block text-xs mb-1" style="color:var(--text-muted)">目標推算時間 (流年/流月/流日)</label>
                        <input type="date" id="targetDate" class="dash-input w-full" style="width:100%">
                    </div>
                    <button onclick="fetchChart()" class="dash-btn dash-btn-primary w-full" style="width:100%">
                        重新計算命盤
                    </button>
                </div>

                <div class="dash-card text-center">
                    <button onclick="openGlossary()" class="dash-btn dash-btn-secondary w-full" style="width:100%">
                        命理辭典
                    </button>
                    <p class="text-xs mt-2" style="color:var(--text-muted)">內含閱讀流程、主星、宮位、地支詳解</p>
                </div>

                <div class="dash-panel-highlight text-xs leading-relaxed" style="color:#c4b5fd">
                    <strong class="text-indigo-300 block mb-1">💡 宮位本位模式說明：</strong>
                    此盤面採用「固定十二宮位」視角，命宮永遠在左上角。當您切換大運或流年時，觀察的是<span class="text-gold font-bold">「哪些地支與星曜飛入了這個宮位」</span>，讓分析財運(財帛宮)或事業(官祿宮)時更加直觀。<br><br>
                    <strong class="text-purple-300">滑鼠游標停靠 (Hover) 在宮位上，可即時查看該宮位與星曜的完整涵義。</strong>
                </div>
            </div>

            <!-- Floating Tooltip -->
            <div id="floating-tooltip" class="hidden fixed p-4 rounded-xl shadow-2xl w-72 z-[9999] pointer-events-none transform transition-opacity duration-200 opacity-0" style="background:var(--bg-card);backdrop-filter:blur(12px);border:1px solid var(--border-accent)"></div>

            <!-- Right Chart -->
            <div class="min-w-0">
                <div class="dash-tabs custom-scrollbar">
                    <button onclick="switchLayer('natal')" id="btn-natal" class="layer-btn active dash-btn dash-btn-sm dash-btn-ghost">先天命盤</button>
                    <button onclick="switchLayer('decade')" id="btn-decade" class="layer-btn dash-btn dash-btn-sm dash-btn-ghost">大運盤</button>
                    <button onclick="switchLayer('annual')" id="btn-annual" class="layer-btn dash-btn dash-btn-sm dash-btn-ghost">流年盤</button>
                    <button onclick="switchLayer('monthly')" id="btn-monthly" class="layer-btn dash-btn dash-btn-sm dash-btn-ghost">流月盤</button>
                    <button onclick="switchLayer('daily')" id="btn-daily" class="layer-btn dash-btn dash-btn-sm dash-btn-ghost">流日盤</button>
                </div>

                <div class="chart-grid-wrap">
                <div class="chart-grid" id="astrolabe">
                    <!-- Fixed Palaces -->
                    <div class="palace-card area-p1" id="box-命宮"><div class="palace-watermark">命宮</div></div>
                    <div class="palace-card area-p2" id="box-兄弟"><div class="palace-watermark">兄弟</div></div>
                    <div class="palace-card area-p3" id="box-夫妻"><div class="palace-watermark">夫妻</div></div>
                    <div class="palace-card area-p4" id="box-子女"><div class="palace-watermark">子女</div></div>
                    <div class="palace-card area-p5" id="box-財帛"><div class="palace-watermark">財帛</div></div>
                    <div class="palace-card area-p6" id="box-疾厄"><div class="palace-watermark">疾厄</div></div>
                    <div class="palace-card area-p7" id="box-遷移"><div class="palace-watermark">遷移</div></div>
                    <div class="palace-card area-p8" id="box-交友"><div class="palace-watermark">交友</div></div>
                    <div class="palace-card area-p9" id="box-官祿"><div class="palace-watermark">官祿</div></div>
                    <div class="palace-card area-p10" id="box-田宅"><div class="palace-watermark">田宅</div></div>
                    <div class="palace-card area-p11" id="box-福德"><div class="palace-watermark">福德</div></div>
                    <div class="palace-card area-p12" id="box-父母"><div class="palace-watermark">父母</div></div>

                    <!-- Center -->
                    <div class="area-center flex flex-col items-center justify-center text-center p-4 rounded-xl shadow-inner" style="background:var(--bg-elevated);border:1px solid var(--border-default)">
                        <div id="c-lunar" class="text-lg font-serif text-slate-200 mb-3">農曆日期</div>
                        <div class="flex flex-wrap justify-center gap-2 text-xs text-slate-400 mb-4">
                            <span id="c-bureau" class="px-2 py-1 bg-slate-800 rounded border border-slate-600">五行局</span>
                            <span id="c-year" class="px-2 py-1 bg-slate-800 rounded border border-slate-600 text-purple-400">流年</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-left text-xs bg-slate-800/80 p-3 rounded-lg border border-slate-600 w-full max-w-[200px]">
                            <div class="text-green-400 font-bold">祿 <span class="text-slate-400 font-normal">機遇/資金</span></div>
                            <div class="text-gold font-bold">權 <span class="text-slate-400 font-normal">擴張/強勢</span></div>
                            <div class="text-blue-400 font-bold">科 <span class="text-slate-400 font-normal">平穩/名聲</span></div>
                            <div class="text-red-400 font-bold">忌 <span class="text-slate-400 font-normal">風險/避險</span></div>
                        </div>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let userData = null;
        let chartData = null;
        let currentLayer = 'natal';
        
        const PALACE_NAMES = ["命宮", "兄弟", "夫妻", "子女", "財帛", "疾厄", "遷移", "交友", "官祿", "田宅", "福德", "父母"];

        // Wait for auth
        window.addEventListener('DOMContentLoaded', async () => {
            userData = await fetchMe();
            if(!userData) {
                document.getElementById('auth-error').classList.remove('hidden');
                return;
            }
            
            document.getElementById('chart-view').classList.remove('hidden');
            document.getElementById('p-name').innerText = userData.realName || userData.username;
            document.getElementById('p-birth').innerText = `${userData.birthYear}/${userData.birthMonth}/${userData.birthDay} ${userData.birthHour}時`;
            
            // Set today as default
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            document.getElementById('targetDate').value = `${yyyy}-${mm}-${dd}`;

            fetchChart();
        });

        async function fetchChart() {
            if(!userData) return;
            const targetDate = document.getElementById('targetDate').value;
            
            const req = {
                year: userData.birthYear, month: userData.birthMonth, day: userData.birthDay, hour: userData.birthHour, targetDate
            };

            const res = await fetch('/api/calculate', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(req)
            });
            const data = await res.json();
            
            if (!data.meta) {
                console.error("Chart Data Error:", data);
                alert("計算排盤失敗：" + (data.error || "未知錯誤"));
                return;
            }

            document.getElementById('c-lunar').innerText = `本命: ${data.meta.lunarDate}\n流運: ${data.meta.targetLunarDate}`;
            document.getElementById('c-bureau').innerText = `${data.meta.bureau}局`;
            document.getElementById('c-year').innerText = `${data.meta.targetYear} ${data.meta.targetYearStem}`;

            chartData = data.chart;
            switchLayer(currentLayer);
        }

        function switchLayer(layer) {
            currentLayer = layer;
            document.querySelectorAll('.layer-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`btn-${layer}`).classList.add('active');

            if(!chartData) return;

            PALACE_NAMES.forEach(pName => {
                const pDiv = document.getElementById(`box-${pName}`);
                if(!pDiv) return;

                // Find the branch data that corresponds to this Palace in the current layer
                // Find the branch data that corresponds to this Palace, checking for common aliases
                const pAliases = { '交友': '僕役', '官祿': '事業' };
                const branchData = chartData.find(b => {
                    if (!b.layers[layer] || !b.layers[layer].name) return false;
                    const chartPalaceName = b.layers[layer].name;
                    return chartPalaceName === pName || chartPalaceName === pAliases[pName];
                });
                if(!branchData) return; // Should not happen

                // Clear dynamic content but keep watermark
                Array.from(pDiv.children).forEach(c => {
                    if(!c.classList.contains('palace-watermark')) c.remove();
                });

                // Add Dynamic Earthly Branch Badge
                const bLabel = document.createElement('div');
                bLabel.className = 'branch-badge';
                bLabel.innerText = `${branchData.earthlyBranch}支`;
                pDiv.appendChild(bLabel);

                const layerData = branchData.layers[layer];
                
                // Stars container
                const starContainer = document.createElement('div');
                starContainer.className = 'absolute top-8 left-2 right-2 flex flex-col gap-1 z-10';
                
                layerData.stars.forEach(s => {
                    const sDiv = document.createElement('div');
                    sDiv.className = 'star-item ' + (s.includes('祿') ? 'text-green-400' : s.includes('忌') ? 'text-red-400' : 'text-slate-300');
                    sDiv.innerText = s;
                    starContainer.appendChild(sDiv);
                });
                pDiv.appendChild(starContainer);

                // Hover Event
                pDiv.onmouseenter = (e) => {
                    const tooltip = document.getElementById('floating-tooltip');
                    tooltip.classList.remove('hidden');
                    // Slight delay to allow display:block before fading in
                    setTimeout(() => tooltip.classList.remove('opacity-0'), 10);
                    
                    // Lookups from Glossary
                    const bDesc = (GLOSSARY_DATA && GLOSSARY_DATA.branches[branchData.earthlyBranch]) ? GLOSSARY_DATA.branches[branchData.earthlyBranch] : '';
                    const pDesc = (GLOSSARY_DATA && GLOSSARY_DATA.palaces[pName]) ? GLOSSARY_DATA.palaces[pName] : '無特別說明';
                    
                    let starDescHtml = '';
                    layerData.stars.forEach(starStr => {
                        const starBase = starStr.split(' ')[0].replace(/[祿權科忌]/g, '');
                        if(GLOSSARY_DATA && GLOSSARY_DATA.stars[starBase]) {
                            starDescHtml += `<div class="mb-2 bg-slate-900/50 p-2 rounded"><span class="text-purple-300 font-bold">${starBase}</span>: ${GLOSSARY_DATA.stars[starBase]}</div>`;
                        }
                        ['祿', '權', '科', '忌'].forEach(t => {
                            if(starStr.includes(t)) {
                                const tName = '化' + t;
                                const tColor = t === '祿' ? 'text-green-400' : (t === '忌' ? 'text-red-400' : 'text-gold');
                                if(GLOSSARY_DATA && GLOSSARY_DATA.trans[tName]) {
                                    starDescHtml += `<div class="mb-1 ml-2 border-l-2 border-slate-600 pl-2"><span class="${tColor} font-bold">${tName}</span>: ${GLOSSARY_DATA.trans[tName]}</div>`;
                                }
                            }
                        });
                    });

                    let layerTitle = layer === 'natal' ? '本命' : layer === 'decade' ? '大運' : layer === 'annual' ? '流年' : layer === 'monthly' ? '流月' : '流日';

                    let html = `
                        <div class="font-bold text-lg text-white mb-2 border-b border-slate-700 pb-2 flex justify-between items-end">
                            <span>${layerTitle} ${pName} <span class="text-xs text-gold ml-2">(${branchData.earthlyBranch}位)</span></span>
                        </div>
                        <div class="text-sm text-amber-200 mb-3 bg-amber-900/40 p-2 rounded border border-amber-900/50 leading-relaxed shadow-inner">${pDesc}</div>
                        <div class="text-xs text-slate-400 mb-3 italic border-l-2 border-slate-600 pl-2">${bDesc}</div>
                    `;
                    
                    if(starDescHtml) {
                        html += `<div class="text-xs text-slate-300 mt-2 space-y-1">${starDescHtml}</div>`;
                    } else {
                        html += `<div class="text-slate-500 mb-2 text-xs p-2 bg-slate-800 rounded text-center">此宮位目前無主星<br>運勢受對宮與外部環境牽引較大。</div>`;
                    }
                    
                    tooltip.innerHTML = html;
                    pDiv.classList.add('border-purple-500', 'bg-slate-800');
                };

                pDiv.onmousemove = (e) => {
                    const tooltip = document.getElementById('floating-tooltip');
                    let x = e.clientX + 15;
                    let y = e.clientY + 15;
                    
                    // Prevent tooltip from going off-screen (right or bottom edge)
                    const rect = tooltip.getBoundingClientRect();
                    if (x + rect.width > window.innerWidth) {
                        x = e.clientX - rect.width - 15;
                    }
                    if (y + rect.height > window.innerHeight) {
                        y = e.clientY - rect.height - 15;
                    }
                    
                    tooltip.style.left = x + 'px';
                    tooltip.style.top = y + 'px';
                };

                pDiv.onmouseleave = () => {
                    const tooltip = document.getElementById('floating-tooltip');
                    tooltip.classList.add('opacity-0');
                    setTimeout(() => {
                        if(tooltip.classList.contains('opacity-0')) {
                            tooltip.classList.add('hidden');
                        }
                    }, 200); // Wait for fade out
                    pDiv.classList.remove('border-purple-500', 'bg-slate-800');
                };
            });
        }
    </script>
</body>
</html>
