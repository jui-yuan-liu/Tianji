<!doctype html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tianji 天機 - 登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/dashboard.css">
    <script src="/app.js"></script>
</head>
<body class="dashboard-app no-sidebar">
    <div class="dash-login-page">
        <div class="dash-login-card">
            <div class="mb-8">
                <div class="dash-brand-icon" style="margin-bottom:14px">機</div>
                <h2 style="font-size:1.125rem;font-weight:600;color:var(--text-primary);letter-spacing:-0.02em">天機會員</h2>
                <p style="color:var(--text-muted);font-size:0.8125rem;margin-top:6px">命理智慧 × 量化投資</p>
            </div>

            <div id="login-form">
                <label style="font-size:0.7rem;color:var(--text-muted);display:block;margin-bottom:4px">帳號</label>
                <input type="text" id="l-user" placeholder="請輸入帳號" class="dash-input w-full mb-4" style="width:100%">
                <label style="font-size:0.7rem;color:var(--text-muted);display:block;margin-bottom:4px">密碼</label>
                <input type="password" id="l-pass" placeholder="請輸入密碼" class="dash-input w-full mb-6" style="width:100%">
                <button onclick="doLogin()" class="dash-btn dash-btn-primary w-full" style="width:100%">登入</button>
                <div class="text-center mt-4 text-sm cursor-pointer" style="color:var(--text-muted)" onclick="toggleForm()">還沒有帳號？註冊</div>
            </div>

            <div id="register-form" class="hidden">
                <input type="text" id="r-user" placeholder="帳號" class="dash-input w-full mb-2" style="width:100%">
                <input type="password" id="r-pass" placeholder="密碼" class="dash-input w-full mb-2" style="width:100%">
                <input type="text" id="r-name" placeholder="姓名 / 暱稱" class="dash-input w-full mb-4" style="width:100%">
                <div class="text-xs mb-2" style="color:var(--text-muted)">出生時間（西元）</div>
                <div class="dash-form-grid-4 mb-6">
                    <input type="number" id="r-year" placeholder="年" class="dash-input text-sm">
                    <input type="number" id="r-month" placeholder="月" class="dash-input text-sm">
                    <input type="number" id="r-day" placeholder="日" class="dash-input text-sm">
                    <input type="number" id="r-hour" placeholder="時" class="dash-input text-sm">
                </div>
                <button onclick="doRegister()" class="dash-btn dash-btn-primary w-full" style="width:100%">註冊並登入</button>
                <div class="text-center mt-4 text-sm cursor-pointer" style="color:var(--text-muted)" onclick="toggleForm()">已有帳號？返回登入</div>
            </div>
            <div id="msg" class="text-center mt-4 text-sm hidden" style="color:#f87171"></div>
        </div>
    </div>

    <script>
        function toggleForm() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('register-form').classList.toggle('hidden');
            document.getElementById('msg').classList.add('hidden');
        }
        async function doLogin() {
            const user = document.getElementById('l-user').value;
            const pass = document.getElementById('l-pass').value;
            try {
                const res = await fetch('/api/users/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();
                if (data.token) { setToken(data.token); window.location.href = '/'; }
                else showMsg(data.error);
            } catch (e) { showMsg('登入失敗'); }
        }
        async function doRegister() {
            const user = document.getElementById('r-user').value;
            const pass = document.getElementById('r-pass').value;
            const name = document.getElementById('r-name').value;
            try {
                const res = await fetch('/api/users/register', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: user, password: pass, realName: name,
                        birthYear: document.getElementById('r-year').value,
                        birthMonth: document.getElementById('r-month').value,
                        birthDay: document.getElementById('r-day').value,
                        birthHour: document.getElementById('r-hour').value
                    })
                });
                const data = await res.json();
                if (data.message) {
                    document.getElementById('l-user').value = user;
                    document.getElementById('l-pass').value = pass;
                    doLogin();
                } else showMsg(data.error);
            } catch (e) { showMsg('註冊失敗'); }
        }
        function showMsg(txt) {
            const el = document.getElementById('msg');
            el.innerText = txt;
            el.classList.remove('hidden');
        }
    </script>
</body>
</html>
